<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh Sách Sản Phẩm</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h2>Quản Lý Sản Phẩm</h2>
    <a th:href="@{/products/add}" class="btn btn-primary mb-3">Thêm Sản Phẩm Mới</a>
    <a th:href="@{/categories}" class="btn btn-secondary mb-3 ms-2">Quản Lý Danh Mục</a>

    <table class="table table-bordered table-hover">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Hình ảnh</th>
                <th>Tên sản phẩm</th>
                <th>Giá</th>
                <th>Số lượng</th>
                <th>Mô tả</th>
                <th>Thao tác</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="product : ${products}">
                <td th:text="${product.id}"></td>
                <td>
                    <img th:if="${product.images}" th:src="@{'/uploads/products/' + ${product.images}}" width="80" height="80" class="img-thumbnail"/>
                </td>
                <td th:text="${product.name}"></td>
                <td th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'"></td>
                <td th:text="${product.quantity}"></td>
                <td th:text="${product.description}"></td>
                <td>
                    <a th:href="@{'/products/edit/' + ${product.id}}" class="btn btn-warning btn-sm">Sửa</a>
                    <a th:href="@{'/products/delete/' + ${product.id}}" class="btn btn-danger btn-sm" onclick="return confirm('Bạn có chắc muốn xóa?')">Xóa</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
