<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh Sách Danh Mục</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h2>Quản Lý Danh Mục</h2>
    <a th:href="@{/categories/add}" class="btn btn-primary mb-3">Thêm Danh Mục Mới</a>
    <a th:href="@{/products}" class="btn btn-secondary mb-3 ms-2">Quản Lý Sản Phẩm</a>

    <table class="table table-bordered table-hover">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Hình ảnh</th>
                <th>Tên danh mục</th>
                <th>Thao tác</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="cat : ${categories}">
                <td th:text="${cat.id}"></td>
                <td>
                    <img th:if="${cat.images}" th:src="@{'/uploads/' + ${cat.images}}" width="80" height="80" class="img-thumbnail"/>
                </td>
                <td th:text="${cat.name}"></td>
                <td>
                    <a th:href="@{'/categories/edit/' + ${cat.id}}" class="btn btn-warning btn-sm">Sửa</a>
                    <a th:href="@{'/categories/delete/' + ${cat.id}}" class="btn btn-danger btn-sm" onclick="return confirm('Bạn có chắc muốn xóa?')">Xóa</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
