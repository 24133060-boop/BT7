<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm Sản Phẩm</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <div class="col-md-6 offset-md-3">
        <h2>Thêm Sản Phẩm Mới</h2>
        <form th:action="@{/products/save}" th:object="${product}" method="post" enctype="multipart/form-data">
            <div class="mb-3">
                <label class="form-label">Tên sản phẩm:</label>
                <input type="text" th:field="*{name}" class="form-control" required/>
            </div>
            <div class="mb-3">
                <label class="form-label">Danh mục:</label>
                <select th:field="*{categoryId}" class="form-select" required>
                    <option value="">-- Chọn danh mục --</option>
                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Giá bán:</label>
                <input type="number" step="0.01" th:field="*{price}" class="form-control" required/>
            </div>
            <div class="mb-3">
                <label class="form-label">Số lượng:</label>
                <input type="number" th:field="*{quantity}" class="form-control" required/>
            </div>
            <div class="mb-3">
                <label class="form-label">Mô tả:</label>
                <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Hình ảnh:</label>
                <input type="file" th:field="*{imageFile}" class="form-control" accept="image/*"/>
            </div>
            <button type="submit" class="btn btn-success">Lưu Sản Phẩm</button>
            <a th:href="@{/products}" class="btn btn-secondary">Hủy</a>
        </form>
    </div>
</body>
</html>
